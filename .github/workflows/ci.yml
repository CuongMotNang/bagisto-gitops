name: GitOps CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Đo bằng `kubectl version` trên cluster hiện tại ngày 2026-11-17:
  #   Server Version: v1.37.0
  # (client cục bộ là v1.35.10, chỉ dùng để build manifest).
  # CẦN XÁC NHẬN LẠI khi Minikube/cluster được nâng cấp. Nếu không có cluster,
  # dùng "1.33.0" theo hướng dẫn và ghi rõ là giá trị cần xác nhận.
  K8S_VERSION: "1.37.0"

  # Phiên bản đã kiểm tra ngày 2026-11-17:
  # - actions/checkout v7.0.1: tag + action.yml tồn tại, release không phải prerelease.
  # - actions/upload-artifact v7.0.2: tag + action.yml tồn tại, release không prerelease.
  # - actions/download-artifact v8.0.2: tag + action.yml tồn tại, release không prerelease.
  # - kubeconform v0.8.0: release asset + CHECKSUMS tải được, chạy thử cục bộ OK.
  # - gitleaks v8.30.1: release asset + checksums tải được, `gitleaks git --help` OK.
  # - trivy v0.76.2: release asset + checksums tải được, `trivy config --help` OK.
  # (aquasecurity/trivy-action v0.36.0 cũng tồn tại và đã pin setup-trivy bằng SHA,
  #  nhưng ở đây cài binary trực tiếp để không phụ thuộc action trung gian.)
  KUBECONFORM_VERSION: "v0.8.0"
  GITLEAKS_VERSION: "v8.30.1"
  TRIVY_VERSION: "0.76.2"

  # Cùng version và SHA256 với workflow update-gitops ở repo source.
  KUSTOMIZE_VERSION: "v5.7.1"
  KUSTOMIZE_SHA256: "ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8"

jobs:
  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yamllint 1.38.0
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check yamllint==1.38.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/yamllint" --version

      - name: Lint YAML
        run: |
          set -euo pipefail
          yamllint --version
          yamllint -c .yamllint base overlays bootstrap .github

  # CHẶN: manifest phải dựng được và không chứa Secret/tag latest/REPLACE.
  kustomize-build:
    name: Kustomize build + guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Kustomize ${{ env.KUSTOMIZE_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}"
          curl -fsSLo kustomize.tar.gz "${base}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Build overlays/dev
        run: |
          set -euo pipefail
          kubectl version --client
          kubectl kustomize overlays/dev --output rendered.yaml
          test -s rendered.yaml
          echo "Số đối tượng theo kind:"
          grep -E '^kind:' rendered.yaml | sort | uniq -c

      - name: Compare pinned Kustomize with kubectl render
        run: |
          set -euo pipefail
          kustomize build overlays/dev | tee kustomize-rendered.yaml >/dev/null
          kubectl_sha="$(sha256sum rendered.yaml | cut -d' ' -f1)"
          kustomize_sha="$(sha256sum kustomize-rendered.yaml | cut -d' ' -f1)"
          {
            echo "## Kustomize render comparison"
            echo "- kubectl kustomize: \`${kubectl_sha}\`"
            echo "- kustomize ${KUSTOMIZE_VERSION}: \`${kustomize_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if cmp -s rendered.yaml kustomize-rendered.yaml; then
            echo "Kết quả: giống hệt." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::Kustomize ghim và kubectl kustomize render khác nhau; xem step summary."
          diff -u rendered.yaml kustomize-rendered.yaml > kustomize-render.diff || true
          {
            echo "Kết quả: KHÁC NHAU."
            echo '```diff'
            sed -n '1,200p' kustomize-render.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Bí mật được tạo tay trên cluster; repo không được chứa đối tượng Secret.
      - name: Guard - no Secret object
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*kind:[[:space:]]*Secret[[:space:]]*$' rendered.yaml; then
            echo "::error::rendered.yaml chứa đối tượng kind: Secret. Bí mật phải được tạo tay trên cluster, không commit vào repo."
            exit 1
          fi
          echo "OK: không có kind: Secret"

      # Chặn tag latest (kể cả tag ngầm định khi image không có tag) và placeholder REPLACE.
      - name: Guard - no latest tag or REPLACE placeholder
        run: |
          set -euo pipefail

          if grep -nE '^[[:space:]]*image:[[:space:]]+.*:latest' rendered.yaml; then
            echo "::error::rendered.yaml còn image dùng tag latest."
            exit 1
          fi

          if grep -nE '^[[:space:]]*image:.*REPLACE' rendered.yaml; then
            echo "::error::rendered.yaml còn chuỗi REPLACE trong image (chưa đặt tag thật)."
            exit 1
          fi

          # Image không có tag/digest sẽ được Kubernetes hiểu là latest.
          if grep -nE '^[[:space:]]*image:[[:space:]]*[^[:space:]]+' rendered.yaml \
              | grep -vE '(@sha256:[0-9a-fA-F]{64}|:[A-Za-z0-9_][A-Za-z0-9_.-]*[[:space:]]*$)'; then
            echo "::error::rendered.yaml có image không ghim tag hoặc digest (mặc định là latest)."
            exit 1
          fi

          echo "OK: không có tag latest, không có REPLACE, mọi image đều có tag/digest"

      - name: Upload rendered manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered.yaml
          path: rendered.yaml
          if-no-files-found: error
          retention-days: 7

  # CHẶN: manifest phải khớp schema Kubernetes (strict, bỏ qua CRD chưa có schema).
  kubeconform:
    name: Kubeconform schema validation
    needs: kustomize-build
    runs-on: ubuntu-latest
    steps:
      - name: Download rendered manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered.yaml
          path: .

      - name: Install kubeconform ${{ env.KUBECONFORM_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLo kubeconform-linux-amd64.tar.gz "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo kubeconform-CHECKSUMS "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' kubeconform-CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate schemas (strict, k8s ${K8S_VERSION})
        run: |
          set -euo pipefail
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version "${K8S_VERSION}" \
            rendered.yaml

  kubeconform-bootstrap:
    name: Kubeconform bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubeconform ${{ env.KUBECONFORM_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLo kubeconform-linux-amd64.tar.gz "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo kubeconform-CHECKSUMS "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' kubeconform-CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate bootstrap CRDs with vendored Argo schemas
        run: |
          set -euo pipefail
          test -s .github/schemas/argoproj.io/application_v1alpha1.json
          test -s .github/schemas/argoproj.io/appproject_v1alpha1.json
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version "${K8S_VERSION}" \
            -schema-location "${GITHUB_WORKSPACE}/.github/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            bootstrap/*.yaml

  # CHỈ BÁO CÁO: exit-code 0 vì đã biết trước có phát hiện (nginx root,
  # thiếu readOnlyRootFilesystem...). Xem số liệu rồi mới đặt ngưỡng chặn.
  trivy-config:
    name: Trivy config scan (report only)
    needs: kustomize-build
    runs-on: ubuntu-latest
    steps:
      - name: Download rendered manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered.yaml
          path: .

      - name: Install Trivy ${{ env.TRIVY_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLo "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo trivy-checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" trivy-checksums.txt | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan rendered manifest in temp directory
        run: |
          set -euo pipefail
          mkdir -p trivy-scan
          cp rendered.yaml trivy-scan/rendered.yaml
          trivy config \
            --quiet \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --skip-version-check \
            trivy-scan | tee trivy-config.txt
          {
            echo "## Trivy config (HIGH/CRITICAL) - report only"
            echo '```'
            cat trivy-config.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # CHẶN: quét toàn bộ lịch sử Git. Không dùng secret, không in giá trị bí mật.
  secret-scan:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ver="${GITLEAKS_VERSION#v}"
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -fsSLo "gitleaks_${ver}_linux_x64.tar.gz" "${base}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSLo gitleaks-checksums.txt "${base}/gitleaks_${ver}_checksums.txt"
          grep " gitleaks_${ver}_linux_x64.tar.gz$" gitleaks-checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${ver}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        run: |
          set -euo pipefail
          gitleaks git \
            --no-banner \
            --redact \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            .

  render-hash-compare:
    name: Render hash compare
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Install Kustomize ${{ env.KUSTOMIZE_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}"
          curl -fsSLo kustomize.tar.gz "${base}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Compare render hashes
        id: compare
        env:
          RENDER_CHANGE_EXPECTED: ${{ contains(github.event.pull_request.labels.*.name, 'render-change-expected') }}
        run: |
          set -euo pipefail

          find_overlay() {
            local root="$1"
            if [[ -d "${root}/apps/bagisto/overlays/dev" ]]; then
              printf '%s\n' "${root}/apps/bagisto/overlays/dev"
              return 0
            fi
            if [[ -d "${root}/overlays/dev" ]]; then
              printf '%s\n' "${root}/overlays/dev"
              return 0
            fi
            echo "::error::Không tìm thấy overlay apps/bagisto/overlays/dev hoặc overlays/dev trong ${root}." >&2
            return 1
          }

          base_overlay="$(find_overlay base)"
          head_overlay="$(find_overlay head)"
          kustomize build "${base_overlay}" > "${RUNNER_TEMP}/base.yaml"
          kustomize build "${head_overlay}" > "${RUNNER_TEMP}/head.yaml"
          base_sha="$(sha256sum "${RUNNER_TEMP}/base.yaml" | cut -d' ' -f1)"
          head_sha="$(sha256sum "${RUNNER_TEMP}/head.yaml" | cut -d' ' -f1)"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

          {
            echo "## Render hash compare"
            echo "- base: \`${base_sha}\` (${base_overlay})"
            echo "- head: \`${head_sha}\` (${head_overlay})"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${base_sha}" == "${head_sha}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Kết quả: giống hệt." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          diff -u "${RUNNER_TEMP}/base.yaml" "${RUNNER_TEMP}/head.yaml" > "${RUNNER_TEMP}/render.diff" || true
          {
            echo "Kết quả: KHÁC NHAU."
            echo '```diff'
            cat "${RUNNER_TEMP}/render.diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${RENDER_CHANGE_EXPECTED}" == "true" ]]; then
            echo "PR có label render-change-expected; chỉ báo diff, không cảnh báo." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Render hash thay đổi nhưng PR không có label render-change-expected."
          fi

      - name: Upload render diff
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-diff
          path: ${{ runner.temp }}/render.diff
          if-no-files-found: error
          retention-days: 7
