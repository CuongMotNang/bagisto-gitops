name: GitOps Manifest Validation

on:
  push:
    branches:
      - master
    paths:
      - 'base/**'
      - 'overlays/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - master
    paths:
      - 'base/**'
      - 'overlays/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Kustomize
      # --------------------------------------------------
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.6.0'

      # --------------------------------------------------
      # 3. Build manifests
      # --------------------------------------------------
      - name: Build Kustomize manifests
        run: |
          mkdir -p rendered

          kustomize build overlays/dev \
            > rendered/dev.yaml

          echo "Kustomize build completed."

      # --------------------------------------------------
      # 4. Setup Go
      # --------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # --------------------------------------------------
      # 5. Install Kubeconform
      # --------------------------------------------------
      - name: Install Kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      # --------------------------------------------------
      # 6. Kubernetes schema validation
      # --------------------------------------------------
      - name: Validate Kubernetes schemas
        run: |
          "$(go env GOPATH)/bin/kubeconform" \
            -strict \
            -summary \
            -kubernetes-version 1.32.0 \
            rendered/dev.yaml

      # --------------------------------------------------
      # 7. Trivy misconfiguration scan
      # --------------------------------------------------
      - name: Run Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: rendered/
          hide-progress: true
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      # --------------------------------------------------
      # 8. Gitleaks secret scanning
      # --------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 9. Git whitespace validation
      # --------------------------------------------------
      - name: Check Git diff
        run: |
          git diff --check

      # --------------------------------------------------
      # 10. Summary
      # --------------------------------------------------
      - name: Validation summary
        if: success()
        run: |
          echo "## GitOps Validation Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kustomize build: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kubernetes schema: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trivy misconfiguration: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gitleaks: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git diff: PASS" >> "$GITHUB_STEP_SUMMARY"