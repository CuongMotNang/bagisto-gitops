# Mục đích: Application Argo CD external-secrets cài ESO chart ghim, dùng values trong repo.
# Phụ thuộc: AppProject platform; chart external-secrets 2.15.0; platform/external-secrets/values.yaml.
# Sync-wave/hook: Không có.
# Owner: cuongmotnang
# Tham chiếu: docs/architecture.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://github.com/CuongMotNang/bagisto-gitops
      targetRevision: master
      ref: values
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.15.0
      helm:
        skipTests: true
        valueFiles:
          - $values/platform/external-secrets/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 0
    syncOptions:
      - CreateNamespace=true
