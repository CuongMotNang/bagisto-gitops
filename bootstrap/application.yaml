apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bagisto
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bagisto
  source:
    repoURL: https://github.com/CuongMotNang/bagisto-gitops
    targetRevision: master
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: bagisto
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 0
    syncOptions:
      - PruneLast=true
