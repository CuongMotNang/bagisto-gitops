# Mục đích: AppProject platform quản lý Vault và External Secrets Operator.
# Phụ thuộc: Argo CD namespace argocd; GitOps repo; Helm repo hashicorp và external-secrets.
# Sync-wave/hook: Không có.
# Owner: cuongmotnang
# Tham chiếu: docs/architecture.md, docs/runbooks/vault-unseal.md
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform services managed from the bagisto-gitops repository
  sourceRepos:
    - https://github.com/CuongMotNang/bagisto-gitops
    - https://helm.releases.hashicorp.com
    - https://charts.external-secrets.io
  destinations:
    - namespace: vault
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
  orphanedResources:
    warn: true
