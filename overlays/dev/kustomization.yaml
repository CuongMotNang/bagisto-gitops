apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Tag image do CI tạo (sha-<7 ký tự>). Sau này job update-gitops sẽ tự sửa chỗ này.
# Thay REPLACE bằng tag thật (xem tab Packages trên GitHub hoặc log bước publish).
images:
  - name: ghcr.io/cuongmotnang/bagisto-app
    newTag: sha-7f040f0
  - name: ghcr.io/cuongmotnang/bagisto-web
    newTag: sha-7f040f0