# Mục đích: Overlay dev cho Bagisto; quản lý tag image do CI/bot cập nhật.
# Phụ thuộc: Base tại ../../base.
# Sync-wave/hook: Không có.
# Owner: cuongmotnang
# Tham chiếu: docs/architecture.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
# Tag image do CI tạo (sha-<7 ký tự>). Sau này job update-gitops sẽ tự sửa chỗ này.
# Thay REPLACE bằng tag thật (xem tab Packages trên GitHub hoặc log bước publish).
images:
- name: ghcr.io/cuongmotnang/bagisto-app
  newTag: sha-b370e6d
- name: ghcr.io/cuongmotnang/bagisto-web
  newTag: sha-b370e6d
